title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search the [existing ideas](https://github.com/pkissling/clock-weather-card/discussions/categories/ideas) first and upvote one that matches instead of opening a duplicate. Once an idea is agreed on, it becomes an issue for implementation.
  - type: textarea
    attributes:
      label: What problem does this solve?
      description: Describe the situation, e.g. "I'm always frustrated when ...".
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: What you'd like the card to do. A config sketch or mockup helps.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you've tried.
  - type: textarea
    attributes:
      label: Additional context
      description: Screenshots, links or anything else.
