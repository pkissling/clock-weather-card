name: Playwright Tests

on:
  push:
  pull_request:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v6

    - name: Pull HA Docker image
      run: docker pull ghcr.io/home-assistant/home-assistant:stable

    # Same pinned image as local runs and snapshot generation, so renders are byte-identical.
    - name: Run Playwright tests
      run: .github/playwright-snapshots-helper/run-in-docker.sh

    - uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
