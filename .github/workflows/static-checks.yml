name: Static Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7.0.1

    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 26

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: yarn install

    - name: Lint
      run: yarn lint:ci

    - name: Build
      run: yarn build

    - name: Unit tests
      run: yarn test:unit

  lockfile:
    name: Verify actions.lock
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: github/gh-actions-lock@verify/v0.5.1
