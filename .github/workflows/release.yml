name: Bundle Release

on:
  release:
    types: [published]
  # Releases created with GITHUB_TOKEN don't emit release events, so release-please dispatches this.
  workflow_dispatch:

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Build
        run: |
          yarn install
          yarn build

      # HACS installs every asset of a plugin release, so the chunks and icons ship as flat assets next to the card.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/*.js dist/*.svg --clobber

      - name: Verify HACS compliance
        uses: hacs/action@main
        with:
          category: plugin
