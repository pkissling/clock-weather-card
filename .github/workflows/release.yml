name: Bundle Release

on:
  release:
    types: [published]
  # Dispatched by release-please.yaml with the release tag as ref
  # (releases created with GITHUB_TOKEN don't trigger release events).
  workflow_dispatch:

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable Corepack
        run: corepack enable

      - name: Build
        run: |
          yarn install
          yarn build

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/clock-weather-card.js
          asset_name: clock-weather-card.js
          tag: ${{ github.ref }}
          overwrite: true

      - name: Verify HACS compliance
        uses: hacs/action@main
        with:
          category: plugin
