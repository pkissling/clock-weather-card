---

name: Release please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
      - name: Trigger release asset build
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -R ${{ github.repository }} --ref ${{ steps.release.outputs.tag_name }}
      # The release PR is pushed with GITHUB_TOKEN, which doesn't trigger workflows, so run the required checks explicitly.
      - name: Run CI on the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          BRANCH=$(jq -r .headBranchName <<<"$PR")
          gh workflow run static-checks.yml -R ${{ github.repository }} --ref "$BRANCH"
          gh workflow run playwright.yml -R ${{ github.repository }} --ref "$BRANCH"
